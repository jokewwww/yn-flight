apiVersion: apps/v1
kind: Deployment
metadata:
  name: oildata-service
  namespace: $NAMESPACE
  labels:
    app: $NAMESPACE
    service: oildata
spec:
  selector:
    matchLabels:
      service: oildata
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: oildata
    spec:
      containers:
        - name: oildata-service
          image: $REGISTRY/$NAMESPACE/oildata-service:SNAPSHOT-$BUILD_NUMBER
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 1000m
              memory: 4096Mi
            limits:
              cpu: 1500m
              memory: 6144Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 32190
            initialDelaySeconds: 120
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 32190
            initialDelaySeconds: 120
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          ports:
            - containerPort: 32190
              name: http
          envFrom:
            - configMapRef:
                name: zhoil-yn-baseinfo
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: oildata-service
  namespace: $NAMESPACE
spec:
  selector:
    service: oildata
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 32190
      targetPort: 32190
      nodePort: 32190