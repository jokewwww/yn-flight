
server.port=${SERVER_PORT:8079}

ribbon.eureka.enabled=false
zuul.routes.api-d.path=/base/**
zuul.routes.api-d.url=http://${REMOTE_LOGIN_IP:127.0.0.1}:${REMOTE_LOGIN_PORT:8080}/base
zuul.routes.api-f.path=/flight/**
zuul.routes.api-f.url=http://${REMOTE_FLIGHT_IP:127.0.0.1}:${REMOTE_FLIGHT_PORT:8081}/flight
zuul.routes.api-g.path=/map/**
zuul.routes.api-g.url=http://${REMOTE_MAP_IP:172.16.7.6}:${REMOTE_MAP_PORT:8082}/map
zuul.routes.api-s.path=/jobschedual/**
zuul.routes.api-s.url=http://${REMOTE_JOB_IP:127.0.0.1}:${REMOTE_JOB_PORT:8084}/jobschedual

# Connect timeout used by Apache HttpClient
zuul.host.connect-timeout-millis=30000
# Read timeout used by Apache HttpClient   ${SOCKET_TIMEOUT_MILLIS:5000}
zuul.host.socket-timeout-millis=120000

zuul.host.max-per-route-connections=20
zuul.host.max-total-connections=400

hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=${HYSTRIX_THREAD_TIMEOUTINMILLISECONDS:30000}

logging.config=classpath:log4j2-${LOG_LEVEL:debug}.properties

# mysql
spring.datasource.url=jdbc:mysql://${MYSQL_ROOT_IP:172.16.7.10}:${MYSQL_ROOT_PORT:3306}/flight_login?useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:Abcd-1234}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
