# server
server.port=${SERVER_PORT:8078}
server.tomcat.uri-encoding=utf-8
# mysql
spring.datasource.url=jdbc:mysql://${MYSQL_ROOT_IP:172.17.1.10}:${MYSQL_ROOT_PORT:3306}/flight_login?useUnicode=true&characterEncoding=UTF-8&useSSL=false&autoReconnect=true&failOverReadOnly=false&serverTimezone=GMT%2B8
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:Abcd-1234}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver


# redis \u914D\u7F6E
spring.redis.database=0
spring.redis.host=${REDIS_ROOT_IP:172.17.1.16}
spring.redis.port=${REDIS_ROOT_PORT:6379}
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-wait=1000
spring.redis.timeout=${REDIS_ROOT_TIMEOUT:120000}

# -------------kafka---------------
spring.kafka.bootstrap-servers=${ZK_IP_PORT:172.17.1.7:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:ntt}

spring.kafka.consumer.auto-offset-reset=earliest
#spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-commit-interval=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

#jpa
spring.jpa.database = MYSQL
spring.jpa.show-sql = true
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5Dialect
spring.jpa.hibernate.ddl-auto = none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

flightChangeLogUrl:${FLIGHT_CHANGE_LOG:flight_change_log}