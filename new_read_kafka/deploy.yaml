apiVersion: apps/v1
kind: Deployment
metadata:
  name: readkafka-service
  namespace: $NAMESPACE
  labels:
    app:  $NAMESPACE
    service: read_kafka
spec:
  selector:
    matchLabels:
      service: read_kafka
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: read_kafka
    spec:
      containers:
      - name:  readkafka-service
        image:  $REGISTRY/$NAMESPACE/new_read_kafka-service:SNAPSHOT-$BUILD_NUMBER
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 1000m
            memory: 4096Mi
          limits:
            cpu: 1500m
            memory: 6144Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 30111
          initialDelaySeconds: 120
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 30111
          initialDelaySeconds: 120
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort:  30111
          name:  http
        envFrom:
        - configMapRef:
            name: zhoil-yn-baseinfo
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: readkafka-service
  namespace: $NAMESPACE
spec:
  selector:
    service: read_kafka
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 30111
    targetPort: 30111