apiVersion: apps/v1
kind: Deployment
metadata:
  name: flightinfo-service
  namespace: $NAMESPACE
  labels:
    app:  $NAMESPACE
    service: flight_info
spec:
  selector:
    matchLabels:
      service: flight_info
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: flight_info
    spec:
      containers:
      - name:  flightinfo-service
        image:  $REGISTRY/$NAMESPACE/new_flight_info-service:SNAPSHOT-$BUILD_NUMBER
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 1000m
            memory: 4096Mi
          limits:
            cpu: 1500m
            memory: 6144Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 30110
          initialDelaySeconds: 120
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 30110
          initialDelaySeconds: 120
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - containerPort:  30110
          name:  http
        envFrom:
        - configMapRef:
            name: zhoil-yn-baseinfo
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: flightinfo-service
  namespace: $NAMESPACE
spec:
  selector:
    service: flight_info
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 30110
    targetPort: 30110