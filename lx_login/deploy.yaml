apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-service
  namespace: $NAMESPACE
  labels:
    app: $NAMESPACE
    service: login
spec:
  selector:
    matchLabels:
      service: login
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        service: login
    spec:
      containers:
        - name: login-service
          image: $REGISTRY/$NAMESPACE/login-service:SNAPSHOT-$BUILD_NUMBER
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 1000m
              memory: 4096Mi
            limits:
              cpu: 1500m
              memory: 6144Mi
          livenessProbe:
            httpGet:
              path: /base/health
              port: 30101
            initialDelaySeconds: 120
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /base/health
              port: 30101
            initialDelaySeconds: 120
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          ports:
            - containerPort: 30101
              name: http
          envFrom:
            - configMapRef:
                name: zhoil-yn-baseinfo
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: login-service
  namespace: $NAMESPACE
spec:
  selector:
    service: login
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 30101
      targetPort: 30101
      nodePort: 30101


